# Checks the Patang Wars game server every 5 minutes. When it stops
# answering, opens a "server-down" issue (GitHub emails the owner); when it
# answers again, closes it with a "wapas" comment. One alert per outage.
name: Server watch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Health URL to check (blank = the real server; a bad URL tests the alert)'
        required: false
        default: ''

permissions:
  contents: write # keepalive commit
  issues: write

concurrency:
  group: server-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the game server
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          URL: ${{ inputs.url || 'https://145-241-122-236.sslip.io/health' }}
        run: |
          ok=false
          body=''
          for i in 1 2 3; do
            body=$(curl -fsS -m 15 "$URL" 2>&1 || true)
            case "$body" in ok*) ok=true; break ;; esac
            [ "$i" -lt 3 ] && sleep 20
          done
          now=$(TZ=Asia/Karachi date '+%d %b %Y, %H:%M PKT')
          open=$(gh issue list -R "$REPO" --label server-down --state open --json number -q '.[0].number')
          if [ "$ok" = true ]; then
            echo "UP: $body"
            if [ -n "$open" ]; then
              gh issue close "$open" -R "$REPO" -c "✅ @$OWNER Server wapas chal raha hai — $now
          \`$body\`"
            fi
          else
            echo "DOWN: $body"
            if [ -z "$open" ]; then
              gh label create server-down -R "$REPO" --color B60205 --description "Game server health check failing" 2>/dev/null || true
              gh issue create -R "$REPO" --label server-down \
                --title "🔴 Game server band hai — $now" \
                --body "@$OWNER Online match server jawab nahi de raha (3 koshishein, 40 s).

          - Check: $URL
          - Jawab: \`$body\`

          Kya karein: ssh ubuntu@145.241.122.236 → \`sudo systemctl status patang\` / \`sudo journalctl -u patang -n 50\`. Oracle console mein instance chal raha hai ya nahi, woh bhi dekhein. Server wapas aate hi yeh issue khud band ho jayega."
            fi
            # No failing run: a failed run every 5 minutes would email each time.
          fi

      # GitHub pauses scheduled workflows after 60 days without commits.
      - uses: actions/checkout@v4
        if: always()
      - name: Keep the schedule alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 24 * 3600 )) ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'keepalive: server watch'
            git push
          fi
